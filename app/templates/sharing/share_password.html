
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès protégé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                        <h3>Accès protégé</h3>
                        <p class="text-muted">Ce projet est protégé par un mot de passe</p>
                        
                        {% if erreur %}
                        <div class="alert alert-danger" role="alert">{{ erreur }}</div>
                        {% endif %}
                        <div class="alert alert-danger" role="alert" id="erreur-recaptcha" hidden></div>
                        <form method="POST" id="form-partage"
                              data-recaptcha-site-key="{{ config.RECAPTCHA_PUBLIC_KEY or '' }}">
                            <input type="hidden" name="recaptcha_token" id="recaptcha_token">
                            <div class="mb-3">
                                <input type="password" name="password" 
                                       class="form-control form-control-lg" 
                                       placeholder="Entrez le mot de passe" 
                                       required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-unlock"></i> Accéder
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- reCAPTCHA Enterprise : jeton généré au moment de l'envoi (usage unique, valable 2 minutes),
         vérifié par le serveur (app/utils/recaptcha.py, action « partage_mot_de_passe »). -->
    <script src="https://www.google.com/recaptcha/enterprise.js?render={{ config.RECAPTCHA_PUBLIC_KEY or '' }}" async defer></script>
    <script>
    (function () {
        var form = document.getElementById('form-partage');
        var cle = form.dataset.recaptchaSiteKey;
        var erreur = document.getElementById('erreur-recaptcha');
        function echec() {
            erreur.textContent = "La vérification de sécurité n'a pas pu se charger. Rechargez la page, puis réessayez.";
            erreur.hidden = false;
        }
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (!cle || !window.grecaptcha || !window.grecaptcha.enterprise) { echec(); return; }
            window.grecaptcha.enterprise.ready(function () {
                window.grecaptcha.enterprise.execute(cle, { action: 'partage_mot_de_passe' }).then(function (jeton) {
                    document.getElementById('recaptcha_token').value = jeton;
                    form.submit();          // n'émet pas de nouvel événement « submit »
                }, echec);
            });
        });
    })();
    </script>
</body>
</html>
