<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module de Stockage Autonome</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='concevoir_mon_projet/CSS/prodsolaire/style_stockage.css') }}">
</head>

<body>

    <button class="btn btn-primary" onclick="openStockage()" style="margin-top: 20px;">Ouvrir la configuration de stockage</button>

    <div id="storageModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal('storageModal')" style="float:right; font-size: 28px; font-weight: bold; cursor:pointer;">&times;</span>
            <h2>Configuration Stockage</h2>

            <!-- Section ajoutée pour le contexte standalone -->
            <h3 class="modal-category-title" style="margin-top: 10px;">Paramètres d'entrée PV (Contexte)</h3>
            <div class="grid section-box" style="background-color: #f0f7ff; border-color: #cce0ff;">
                <div class="form-group"><label>Puissance PV (kWc)</label><input type="number" id="sto_puissance" value="100" oninput="calcStockage()"></div>
                <div class="form-group"><label>Productible annuel (kWh/kWc/an)</label><input type="number" id="sto_productible" value="1250" oninput="calcStockage()"></div>
                <div class="form-group"><label>Taux d'Autoconso. existant (%)</label><input type="number" id="sto_taux_initial" value="80" oninput="updateInitialTaux(); calcStockage()"></div>
            </div>

            <h3 class="modal-category-title">Caractéristiques techniques batterie </h3>
            <div class="grid section-box">
                <div class="form-group"><label>Capacité batterie (kWh)</label><input type="number" id="sto_cap" value="200" oninput="calcStockage()"></div>
                <div class="form-group"><label>Puissance onduleur-chargeur (kVA)</label><input type="number" id="sto_ond_power" value="100" oninput="calcStockage()"></div>
                <div class="form-group"><label>DOD (%)</label><input type="number" id="sto_dod" value="80" oninput="calcStockage()"></div>
                <div class="form-group"><label>Rendement de conv. batterie</label><input type="number" id="sto_rendement" value="0.9" step="0.01" oninput="calcStockage()"></div>
                <div class="form-group"><label>Nbre de cycle batterie</label><input type="number" id="sto_cycles" value="3665" oninput="calcStockage()"></div>
                <div class="form-group"><label>Dégradation calendaire (annuelle) (%)</label><input type="number" id="sto_degrad_cal" value="3" oninput="calcStockage()"></div>
                <div class="form-group"><label>Durée d'utilisation batterie (ans)</label><input type="number" id="sto_duree_vie" readonly></div>
                <div class="form-group"><label>Capacité de stockage annuel (MWh/an)</label><input type="number" id="sto_annuel" readonly></div>
            </div>

            <h3 class="modal-category-title">Conversions & énergie</h3>
            <div class="grid section-box">
                <div class="form-group"><label>Production d’énergie solaire autocons. (MWh)</label><input type="number" id="sto_prod_autoconsommee" readonly></div>
                <div class="form-group"><label>Taux d'autoconso directe (%)</label><input type="number" id="sto_taux_ref" readonly></div>
                <div class="form-group"><label>Rendement bat. conv soutirage</label><input type="number" id="sto_rendement_soutirage" value="0.95" step="0.01" oninput="calcStockage()"></div>
                <div class="form-group"><label>Taux Autoconso Directe PV (%)</label><input type="number" id="sto_taux_direct" value="56" oninput="calcStockage()"></div>
                <div class="form-group"><label>Taux Autoconso Stockage PV (%)</label><input type="number" id="sto_taux_stock" value="24" oninput="calcStockage()"></div>
                <div class="form-group"><label>Stockage réseau et restitution (MWh/an)</label><input type="number" id="sto_reseau" readonly></div>
                <div class="form-group"><label>Énergie stockée sur la durée de vie (MWh)</label><input type="number" id="sto_energie_vie" readonly></div>
                <div class="form-group" style="display:none;"><label>Fraction d’énergie Rest. bat hiver (%)</label><input type="number" id="sto_frac_recharge_hiver" value="30" oninput="calcStockage()"></div>
                <div class="form-group" style="display:none;"><label>Fraction d’énergie Rest. bat été (%)</label><input type="number" id="sto_frac_recharge_ete" value="70" oninput="calcStockage()"></div>
                <div class="form-group" style="display:none;"><label>Ratio Restitution Batterie (%)</label><input type="number" id="sto_ratio_restitution" value="100" min="0" max="100" oninput="calcStockage()"></div>
            </div>

            <h3 class="modal-category-title">Planification recharge</h3>
            <div class="grid section-box">
                <div class="form-group">
                    <label>Activation de la restitution de l'énergie de la batterie</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sto_restitution_toggle" value="oui" onchange="calcStockage()"> Oui</label>
                        <label><input type="radio" name="sto_restitution_toggle" value="non" checked onchange="calcStockage()"> Non</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Plage de Recharge (<span id="sto_recharge_display">8h sélectionnées</span>) <small style="color:var(--text-secondary); font-weight:normal;">- Recharge réseau (HC)</small></label>
                    <div id="sto_recharge_selector" class="time-selector"></div>
                    <input type="hidden" id="sto_recharge_hours" value="[22,23,0,1,2,3,4,5]">
                </div>
                <div class="form-group">
                    <label>Plage de Décharge (<span id="sto_decharge_display">8h sélectionnées</span>)</label>
                    <div id="sto_decharge_selector" class="time-selector"></div>
                    <input type="hidden" id="sto_decharge_hours" value="[22,23,0,1,2,3,4,5]">
                </div>
            </div>
            
            <div style="grid-column: 1 / -1; color: red; text-align: center; min-height: 20px; font-weight: bold;" id="sto_error_msg"></div>
            
            <div style="display: flex; align-items: center; gap: 20px; margin-top: 20px; flex-wrap: wrap;">
                <table id="bilan_energetique_table" class="results-table" style="flex: 1; min-width: 300px;">
                    <thead>
                        <tr>
                            <th>Bilan énergétique</th>
                            <th>Énergie (MWh/an)</th>
                        </tr>
                    </thead>
                    <tbody id="bilan_energetique_body"></tbody>
                </table>
                <div style="width:300px; height:300px; margin: 0 auto;">
                    <canvas id="storageChart"></canvas>
                </div>
            </div>

            <div style="text-align:center; margin-top:30px;">
                <button class="btn btn-secondary" onclick="closeModal('storageModal')">Fermer</button>
            </div>
        </div>
    </div>

    <script type="module"
        src="{{ url_for('static', filename='concevoir_mon_projet/javascript/prodsolaire/main_stockage.js') }}"></script>
</body>

</html>
