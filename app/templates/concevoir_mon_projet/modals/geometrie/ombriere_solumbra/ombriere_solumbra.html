    <style>
        :root {
            --main-color: #DC2626;
            --main-color-hover: #B91C1C;
            --modal-default-width: 100vw;
            --modal-default-height: 100vh;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb;
        }

        /* Styles pour le modal de lancement */
        #welcome-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #welcome-modal {
            background-color: white;
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            max-width: 500px;
            text-align: center;
        }

        #launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            background-color: var(--main-color);
            color: white;
            font-weight: 700;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        #launch-btn:hover {
            background-color: var(--main-color-hover);
        }

        #launch-btn svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        #app-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--modal-default-width);
            height: var(--modal-default-height);
            min-width: 800px;
            min-height: 600px;
            background-color: #f0f2f5;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            transition: width 0.3s ease-in-out, left 0.3s ease-in-out;
        }

        #modal-header {
            background-color: var(--main-color);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem 0.75rem 0 0;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            display: none;
        }
        
        #modal-header h2 {
            font-weight: 600;
        }

        .modal-header-btn {
            background: none;
            border: none;
            color: white;
            padding: 0.25rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .modal-header-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .modal-header-btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        #modal-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }

        .controls-container {
            background-color: #ffffff;
            overflow-y: auto;
            transition: all 0.3s ease-in-out;
            overflow-x: hidden;
        }

        .canvas-container {
            position: relative;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: default;
            width: 100%;
            height: 100%;
        }

        canvas.grabbing {
            cursor: grabbing;
        }

        .input-group-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            grid-column: 1 / -1;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem 1.5rem;
        }

        .span-2 {
            grid-column: span 2 / span 2;
        }

        .tab-button {
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            padding: 0.75rem 1rem;
        }

        .tab-button.active {
            border-bottom-color: var(--main-color);
            color: var(--main-color);
            font-weight: 600;
        }

        .view-title {
            color: var(--main-color);
            font-weight: 600;
            text-align: center;
            padding-top: 0.5rem;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            pointer-events: none;
        }

        .tool-button {
            height: 2.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0 0.5rem;
        }

        .tool-button.icon-only {
            width: 2.25rem;
            padding: 0;
        }

        .tool-button:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }

        .tool-button.active {
            background-color: var(--main-color);
            color: #ffffff;
            border-color: var(--main-color);
        }

        .tool-button:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .dim-color-btn {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .dim-color-btn.active {
            border-color: var(--main-color);
            box-shadow: 0 0 0 2px var(--main-color);
        }

        .toggle-btn-group button {
            background-color: #e5e7eb;
        }

        .toggle-btn-group button.active {
            background-color: var(--main-color);
            color: white;
        }

        .toggle-btn-group button:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            border-color: #d1d5db;
        }

        .toggle-btn-group.equal-width {
            display: flex;
        }

        .toggle-btn-group.equal-width button {
            flex: 1;
        }

        #model-btn-group button {
            background-color: #e5e7eb;
        }

        #model-btn-group button.active {
            background-color: var(--main-color);
            color: white;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }

        .leaflet-container {
            z-index: 10;
        }

        #geometry-inputs {
            transition: all 0.3s ease-out;
            max-height: 500px;
            overflow: hidden;
        }

        #geometry-inputs.collapsed {
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            gap: 0 !important;
        }

        #geometry-title.collapsed #geometry-chevron {
            transform: rotate(-90deg);
        }

        /* MOD 1.5: Styles pour masquer le formulaire */
        #app-modal.form-hidden #controls-container {
            width: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            opacity: 0;
            border: none;
        }

        #app-modal.form-hidden #canvas-column {
            grid-column: span 3 / span 3;
        }

        #app-modal.form-hidden #toggle-form-btn svg {
            transform: rotate(180deg);
        }

        /* MOD 1.0 (Alignement): Ajustement des conteneurs de canvas */
        #coupe-container {
            display: flex;
            flex-direction: column;
            flex: 2 !important;
            width: 100% !important;
            margin-top:35px;
            transition: height 0.1s ease-out;
        }
        #viewCoupe {
            min-height: 0; 
            height: 100vh;
            max-height: 105vh;
        }
        #facade-block-container {
            display: flex;
            flex: 1!important;
            width: 100% !important;
            /* margin-left: -10% !important; */
            /* margin-top: 3% !important;  */
            transition: height 0.1s ease-out;
        }
        #viewFacade {
            min-height: 0;
            height: 40vh;
        }

        #viewCalepinage{
            min-height: 1000px;
        }
        @media print {
            body>*:not(#app-modal) {
                display: none !important;
            }

            #app-modal,
            #modal-body {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                position: static !important;
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
                transform: none !important;
            }

            #modal-header,
            .controls-container,
            header,
            .z-10,
            #welcome-modal-overlay {
                display: none !important;
            }

            .lg\:col-span-2 {
                width: 100%;
                page-break-after: always;
            }

            .grid {
                display: block !important;
            }
        }

        /* MOD: Force la disparition totale du bloc bas et du formulaire */
        #app-modal.calepinage-full #facade-block-container {
            display: none !important;
            height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #app-modal.calepinage-full #coupe-container {
            height: 100% !important;
            flex: 1 1 100% !important;
            max-width: 100% !important;
            width: 100%;
            min-width: 100%;
            /* margin-left: -7.5% !important; */
            /* margin-top: 2% !important; */
            
        }

        #app-modal.form-hidden #controls-container {
            display: none !important;
        }

        #app-modal.form-hidden #canvas-column {
            grid-column: span 3 / span 3 !important;
        }

        #canvas-column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }


        @media print {
    canvas {
        max-width: 100%;
        height: auto;
    }
    .canvas-container {
        page-break-after: avoid;
        break-inside: avoid;
    }
    #viewImplantation, #viewFacade, #viewCoupe {
        page-break-after: always;
    }
}

#coupe-container,
#facade-block-container {
    max-height: 600px !important;   
    min-height: 500px !important;
}

/* Pour le mode calepinage, ne pas limiter */
#app-modal.calepinage-full #coupe-container {
    max-height: none !important;
    min-height: auto !important;
}

    <script>
        // Validation supplémentaire: hauteur sous renfort < hauteur libre de passage
        const passageHeightInput = document.getElementById('passageHeight');
        const heightUnderBraceInput = document.getElementById('heightUnderBrace');

        function validateHeightUnderBrace() {
            const passage = parseFloat(passageHeightInput.value) || 0;
            const brace = parseFloat(heightUnderBraceInput.value) || 0;
            if (brace >= passage) {
                heightUnderBraceInput.setCustomValidity('La hauteur sous renfort doit être inférieure à la hauteur libre de passage.');
            } else {
                heightUnderBraceInput.setCustomValidity('');
            }
        }
        passageHeightInput.addEventListener('input', validateHeightUnderBrace);
        heightUnderBraceInput.addEventListener('input', validateHeightUnderBrace);
        validateHeightUnderBrace();
    </script>

    <script>
        function _getTargetPvId(data) {
            const urlParams = new URLSearchParams(window.location.search);
            const pvId = urlParams.get('pvId');
            if (pvId && data.shapes?.[pvId]) return pvId;
            return Object.keys(data.shapes ?? {})[0] ?? null;
        }

        // Appliquer les règles d'affichage des boutons selon count_y
        function applyModelFilters() {
            const bypassCheckbox = document.getElementById('bypass-filters');
            const errorDiv = document.getElementById('model-filter-error');
            const btnGroup = document.getElementById('model-btn-group');
            
            const btnOffset = document.getElementById('modelOffsetPost');
            const btnDouble = document.getElementById('modelDoublePost');
            const btnInclined = document.getElementById('modelInclinedPost');
            const btnYShape = document.getElementById('modelYShape');
            
            const allBtns = [btnOffset, btnDouble, btnInclined, btnYShape];
            
            allBtns.forEach(btn => { if(btn) btn.style.display = 'inline-flex'; });
            if(errorDiv) errorDiv.classList.add('hidden');
            if(btnGroup) btnGroup.style.display = 'flex';
            
            if (bypassCheckbox && bypassCheckbox.checked) return;
            
            let count_y = null;
            
            // Essayer de lire count_y depuis l'iframe
            try {
                const iframe = document.getElementById('iframeCalepinage');
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    const countYInput = iframe.contentWindow.document.getElementById('count_y');
                    if (countYInput && countYInput.value) {
                        count_y = parseInt(countYInput.value, 10);
                    }
                }
            } catch (e) {}

            // Fallback via le localStorage
            if (count_y === null || isNaN(count_y)) {
                try {
                    const savedData = localStorage.getItem('solarProjectData');
                    if (savedData) {
                        const data = JSON.parse(savedData);
                        const targetPvId = _getTargetPvId(data);
                        if (targetPvId && data.formData && data.formData[targetPvId]) {
                            if (data.formData[targetPvId].count_y) {
                                count_y = parseInt(data.formData[targetPvId].count_y, 10);
                            } else if (data.shapes && data.shapes[targetPvId] && data.shapes[targetPvId].gridInfo) {
                                count_y = parseInt(data.shapes[targetPvId].gridInfo.numRows, 10);
                            }
                        }
                    }
                } catch (e) { console.warn('Erreur lecture count_y:', e); }
            }
            
            if (count_y === null || isNaN(count_y)) return;
            
            allBtns.forEach(btn => { if(btn) btn.style.display = 'none'; });
            let hasVisible = false;
            
            if (count_y === 3) {
                if(btnOffset) { btnOffset.style.display = 'inline-flex'; hasVisible = true; }
            } else if (count_y === 4) {
                if(btnDouble) { btnDouble.style.display = 'inline-flex'; hasVisible = true; }
            } else if (count_y === 6) {
                if(btnInclined) { btnInclined.style.display = 'inline-flex'; hasVisible = true; }
                if(btnYShape) { btnYShape.style.display = 'inline-flex'; hasVisible = true; }
            }
            
            if (!hasVisible) {
                if(btnGroup) btnGroup.style.display = 'none';
                if(errorDiv) {
                    errorDiv.textContent = "Configuration calepinage non conforme aux gabarits existants des ombrières Solumbra. Veuillez contacter le fabricant de l’ombrière pour la prise en compte de votre calepinage hors catalogue.";
                    errorDiv.classList.remove('hidden');
                }
            } else {
                if(btnGroup) btnGroup.style.display = 'flex';
                if(errorDiv) errorDiv.classList.add('hidden');
                
                const activeBtn = document.querySelector('#model-btn-group button.active');
                if (!activeBtn || activeBtn.style.display === 'none') {
                    const firstVisible = allBtns.find(btn => btn && btn.style.display !== 'none');
                    if (firstVisible) firstVisible.click();
                }
            }
        }

        // Fonction pour mettre à jour les champs depuis localStorage
        function updateDimensionsFromStorage() {
            try {
                const savedData = localStorage.getItem('solarProjectData');
                if (!savedData) return;

                const data = JSON.parse(savedData);
                const targetPvId = _getTargetPvId(data);
                if (!targetPvId) return;

                const gridInfo = data.shapes[targetPvId]?.gridInfo;
                if (!gridInfo) return;

                const totalLength = gridInfo.totalPanelLength;
                const totalWidth = gridInfo.totalPanelWidth;
                // Normalisation identique à SummaryModal.js
                const longueur = Math.max(totalLength, totalWidth);
                const largeur = Math.min(totalLength, totalWidth);

                // Synchronise "Nbre de PV Calepinage (LxC)" avec la disposition réelle du calepinage
                // (même source que le tableau de synthèse de SummaryModal.js : gridInfo.numRows/numCols).
                const pvLayoutInput = document.getElementById('pvLayout');
                if (pvLayoutInput && gridInfo.numRows && gridInfo.numCols) {
                    pvLayoutInput.value = `${gridInfo.numRows}L x ${gridInfo.numCols}C`;
                }

                const facadeInput = document.getElementById('facadeLength');
                const panelWidthInput = document.getElementById('panelWidth');

                // facadeLength = longueur (grande dim), comme SummaryModal
                if (facadeInput && longueur) {
                    facadeInput.value = longueur.toFixed(2);
                    facadeInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
                // panelWidth = largeur (petite dim), comme SummaryModal
                if (panelWidthInput && largeur) {
                    panelWidthInput.value = largeur.toFixed(2);
                    panelWidthInput.dispatchEvent(new Event('input', { bubbles: true }));
                }

                // Synchroniser l'inclinaison depuis formData du pvId cible
                const inclinaison = data.formData?.[targetPvId]?.inclinaison;
                if (inclinaison !== undefined && inclinaison !== '' && inclinaison !== null) {
                    const roofSlopeInput = document.getElementById('roofSlope');
                    if (roofSlopeInput) {
                        roofSlopeInput.value = inclinaison;
                        roofSlopeInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                    const iframe = document.getElementById('iframeCalepinage');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ type: 'SET_INCLINAISON', value: Number(inclinaison) }, '*');
                    }
                }

                // Envoyer les dimensions toiture au calepinage iframe
                // Priorité : formData.longueur/largeur (dimensions surface dessinée), sinon gridInfo
                const formLongueur = parseFloat(data.formData?.[targetPvId]?.longueur) || null;
                const formLargeur = parseFloat(data.formData?.[targetPvId]?.largeur) || null;
                const dimLongueur = formLongueur || (totalLength ? Number(totalLength.toFixed(2)) : null);
                const dimLargeur = formLargeur || (totalWidth ? Number(totalWidth.toFixed(2)) : null);
                if (dimLongueur && dimLargeur) {
                    const iframe = document.getElementById('iframeCalepinage');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'SET_TOITURE_DIMS',
                            longueur: dimLongueur,
                            largeur: dimLargeur
                        }, '*');
                    }
                }

                // Optionnel : actualiser le filtrage après synchro
                applyModelFilters();
            } catch (e) {
                console.warn('Erreur lors de la lecture des dimensions:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDimensionsFromStorage();
            
            const bypassCheckbox = document.getElementById('bypass-filters');
            if (bypassCheckbox) {
                bypassCheckbox.addEventListener('change', applyModelFilters);
            }
            
            // Lancer après initialisation pour s'assurer que le localstorage est peuplé
            setTimeout(() => {
                applyModelFilters();
            }, 500);
            
            const iframe = document.getElementById('iframeCalepinage');
            if (iframe) {
                iframe.addEventListener('load', () => {
                    updateDimensionsFromStorage();
                    try {
                        const countYInput = iframe.contentWindow.document.getElementById('count_y');
                        if (countYInput) {
                            countYInput.addEventListener('change', applyModelFilters);
                            countYInput.addEventListener('input', applyModelFilters);
                        }
                    } catch(e) {}
                    applyModelFilters();
                });
            }
        });
        window.addEventListener('storage', (e) => {
            if (e.key === 'solarProjectData') {
                updateDimensionsFromStorage();
                applyModelFilters();
            }
        });
        
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CALEPINAGE_UPDATE') {
                applyModelFilters();
            }
        });
    </script>
