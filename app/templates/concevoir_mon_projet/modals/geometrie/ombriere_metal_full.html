            const angle_R = -roofSlopeRadians * (localInvertSlope ? -1 : 1);
            const cos_L = Math.cos(angle_L); const sin_L = Math.sin(angle_L);
            const cos_R = Math.cos(angle_R); const sin_R = Math.sin(angle_R);

            const panelWidthForY = panelWidthScaled; 
            
            const panelTop_L_rel = {
                x: (-postWidthScaled / 2) + (-panelWidthForY) * cos_L - panelY * sin_L,
                y: beamCenterY + (-panelWidthForY) * sin_L + panelY * cos_L
            };
            const panelTop_R_rel = {
                x: (+postWidthScaled / 2) + (panelWidthForY) * cos_R - panelY * sin_R,
                y: beamCenterY + (panelWidthForY) * sin_R + panelY * cos_R
            };
            
            const panelHighestY = Math.min(panelTop_L_rel.y, panelTop_R_rel.y);
            const structureHighestY = panelHighestY;
            const structureHighestHeight = -structureHighestY / scale;

            let braceLowestY;
            if (appState.reinforcementType === 'jarrets') {
                 braceLowestY = -values.heightUnderBrace * scale; // Jarret hauteur
            } else {
                 braceLowestY = -values.heightUnderBrace * scale; // Bracon hauteur
            }
            
            const structureLowestHeight = -braceLowestY / scale;

            const dimLineX_L = panelTop_L_rel.x -0.1 * scale;
            const dimLineX_R = panelTop_R_rel.x + 0.1 * scale;
            
            drawVerticalDimensionWithLeader(ctx, panelTop_L_rel.x, structureHighestY, dimLineX_L, `${structureHighestHeight.toFixed(2)}m`, 0);
            drawVerticalDimensionWithLeader(ctx, panelTop_R_rel.x, structureHighestY, dimLineX_R, `${structureHighestHeight.toFixed(2)}m`, 0);

            const leaderStartX_L = -postWidthScaled / 2;
            drawVerticalDimensionWithLeader(ctx, leaderStartX_L, braceLowestY, dimLineX_L+5*scale, `${structureLowestHeight.toFixed(2)}m`, 0);
            const leaderStartX_R = postWidthScaled / 2;
            drawVerticalDimensionWithLeader(ctx, leaderStartX_R, braceLowestY, dimLineX_R-5*scale, `${structureLowestHeight.toFixed(2)}m`, 0);

        } else {
            // Cotations verticales pour les autres modèles
            drawVerticalDimensionWithLeader(ctx, beamCorners[0].x, structureLowestY, dimOffsetLeft, `${passageHeight.toFixed(2)}m`, 0);
            drawVerticalDimensionWithLeader(ctx, panelLowest.x, panelLowest.y, structureMinX - 1.0 * scale, `${lowPointHeight.toFixed(2)}m`, 0);
            
            if (appState.postModel !== 'double' && appState.postModel !== 'inclinedPost') {
                let basePostX = 0;
                if (appState.offsetPostSide !== 'center') {
                    const halfPanelHorizontal = (panelWidthScaled / 2) * Math.cos(roofSlopeRadians);
                    if (appState.offsetPostSide === 'low') basePostX = localInvertSlope ? halfPanelHorizontal : -halfPanelHorizontal;
                    if (appState.offsetPostSide === 'high') basePostX = localInvertSlope ? -halfPanelHorizontal : halfPanelHorizontal;
                }
                const postCenterX = (basePostX + values.postEccentricity) * scale;
                drawVerticalDimensionWithLeader(ctx, postCenterX, -postHeightScaled, postCenterX + dimOffsetRight, `${postHeight.toFixed(2)}m`, 0);
            }
            
            drawVerticalDimensionWithLeader(ctx, panelHighest.x, panelHighest.y, Math.max(...panelCorners.map(p=>p.x)) + 1.0 * scale, `${highPointHeightValue.toFixed(2)}m`, 0);
        }

        // --- FIN BLOC COTATIONS VERTICALES ---


        // Cotation "Hauteur sous renfort" (pour modèles non-Y et non-inclined)
        const braceAttachOnPostY = -heightUnderBrace * scale;
        
        if (appState.postModel !== 'y_shape' && appState.postModel !== 'inclinedPost' && (appState.reinforcementType === 'bracons' || (appState.postModel === 'double' && appState.showDoubleBracing))) {
            let dimLineX = -2 * scale;
            let leaderStartX = 0;
            
            if (appState.postModel === 'single') {
                leaderStartX = postWidthScaled / 2;
                dimLineX = -postWidthScaled/2 - 2 * scale;
                drawVerticalDimensionWithLeader(ctx, leaderStartX, braceAttachOnPostY, dimLineX, `${heightUnderBrace.toFixed(2)}m`, 0);
            
            } else if (appState.postModel === 'offset') {
                let basePostX = 0;
                if (appState.offsetPostSide !== 'center') {
                    const halfPanelHorizontal = (panelWidthScaled / 2) * Math.cos(roofSlopeRadians);
                    if (appState.offsetPostSide === 'low') basePostX = localInvertSlope ? halfPanelHorizontal : -halfPanelHorizontal;
                    if (appState.offsetPostSide === 'high') basePostX = localInvertSlope ? -halfPanelHorizontal : halfPanelHorizontal;
                }
                const postCenterX = (basePostX + values.postEccentricity) * scale;
                leaderStartX = postCenterX + (appState.showBraceRight ? postWidthScaled / 2 : -postWidthScaled / 2);
                dimLineX = postCenterX - postWidthScaled/2 - 2 * scale;
                drawVerticalDimensionWithLeader(ctx, leaderStartX, braceAttachOnPostY, dimLineX, `${heightUnderBrace.toFixed(2)}m`, 0);
            
            } else if (appState.postModel === 'double') {
                const spacing = postSpacing * scale / 2;
                leaderStartX = -spacing - postWidthScaled / 2; // Bord extérieur du poteau gauche
                dimLineX = leaderStartX - 2 * scale; // 2m à gauche
                drawVerticalDimensionWithLeader(ctx, leaderStartX, braceAttachOnPostY, dimLineX, `${heightUnderBrace.toFixed(2)}m`, 0);
            }
        
        }
        
        // --- DEBUT BLOC COTATIONS HORIZONTALES ---

        if (appState.postModel === 'y_shape') {
            const angle_L = roofSlopeRadians * (localInvertSlope ? -1 : 1);
            const angle_R = -roofSlopeRadians * (localInvertSlope ? -1 : 1);
            const cos_L = Math.cos(angle_L); const sin_L = Math.sin(angle_L);
            const cos_R = Math.cos(angle_R); const sin_R = Math.sin(angle_R);

            const panelWidthForY = panelWidthScaled; 
            
            const p_left_end = {
                x: (-postWidthScaled / 2) + (-panelWidthForY) * cos_L - panelY * sin_L,
                y: beamCenterY + (-panelWidthForY) * sin_L + panelY * cos_L
            };
            
            const p_right_end = {
                x: (+postWidthScaled / 2) + (panelWidthForY) * cos_R - panelY * sin_R,
                y: beamCenterY + (panelWidthForY) * sin_R + panelY * cos_R
            };
            
            const totalProjWidth = values.totalProjectionWidth;
            
            const projY = 0.5 * scale;
            drawDimensionLine(ctx, p_left_end.x, projY, p_right_end.x, projY, `${totalProjWidth.toFixed(2)}m`, 0, false);

        } else {
            // Cotations horizontales pour les autres modèles
            const projectionHorizontale = values.totalProjectionWidth;
            const projMinX = Math.min(...panelCorners.map(p=>p.x));
            const projMaxX = Math.max(...panelCorners.map(p=>p.x));
            
            let projDimY = 0.8 * scale; 
            if (appState.postModel === 'double' || appState.postModel === 'inclinedPost' || appState.postModel === 'offset') {
                projDimY = 1.1 * scale; 
            }

            if (appState.postModel === 'offset' && (appState.offsetPostSide !== 'center' || postEccentricity !== 0)) {
                let basePostX = 0;
                if (appState.offsetPostSide !== 'center') {
                    const halfPanelHorizontal = (panelWidthScaled / 2) * Math.cos(roofSlopeRadians);
                    if (appState.offsetPostSide === 'low') basePostX = localInvertSlope ? halfPanelHorizontal : -halfPanelHorizontal;
                    if (appState.offsetPostSide === 'high') basePostX = localInvertSlope ? -halfPanelHorizontal : halfPanelHorizontal;
                }
                const postCenterX = (basePostX + values.postEccentricity) * scale;
                const totalProj = (projMaxX - projMinX) / scale;
                
                const dimY_L1 = projDimY - 0.5 * scale;
                const val1 = (postCenterX - projMinX) / scale;
                const val2 = (projMaxX - postCenterX) / scale;
                
                drawDimensionLine(ctx, projMinX, dimY_L1, postCenterX, dimY_L1, `${Math.abs(val1).toFixed(2)}m`, 0, false);
                drawDimensionLine(ctx, postCenterX, dimY_L1, projMaxX, dimY_L1, `${Math.abs(val2).toFixed(2)}m`, 0, false);

                drawDimensionLine(ctx, projMinX, projDimY, projMaxX, projDimY, `${totalProj.toFixed(2)}m`, 0, false);
                
                const structuralCenterX = (projMinX + projMaxX) / 2;
                if (Math.abs(postCenterX - structuralCenterX) > 0.01 * scale) { 
                    const dimY_L3 = projDimY + 0.3 * scale; 
                    drawDimensionLine(ctx, structuralCenterX, dimY_L3, postCenterX, dimY_L3, `${Math.abs(values.postEccentricity).toFixed(2)}m`, 0, false);
                }

            } else if (appState.postModel === 'single') {
                projDimY += 0.2 * scale;
                const dimY_L1 = projDimY - 0.6 * scale; 
                const postCenterX = 0;

                const halfProj = projectionHorizontale / 2;
                drawDimensionLine(ctx, projMinX, dimY_L1, postCenterX, dimY_L1, `${halfProj.toFixed(2)}m`, 0, false);
                drawDimensionLine(ctx, postCenterX, dimY_L1, projMaxX, dimY_L1, `${halfProj.toFixed(2)}m`, 0, false);
                
                drawDimensionLine(ctx, projMinX, projDimY, projMaxX, projDimY, `${projectionHorizontale.toFixed(2)}m`, 0, false);

            } else { // Pour double, inclined
                 drawDimensionLine(ctx, projMinX, projDimY, projMaxX, projDimY, `${projectionHorizontale.toFixed(2)}m`, 0, false);
            }
            
            drawDimensionLine(ctx, panelCorners[0].x, panelCorners[0].y, panelCorners[1].x, panelCorners[1].y, `${values.panelWidth.toFixed(2)}m`, -30, false);
        }

        // --- FIN BLOC COTATIONS HORIZONTALES ---


        if (appState.postModel === 'double' || appState.postModel === 'inclinedPost') {
            const spacingValue = (appState.postModel === 'double') ? postSpacing : postSpacingInclined;
            const spacing = spacingValue * scale / 2;
            const dimY = 0.5 * scale;
            drawDimensionLine(ctx, -spacing, dimY, spacing, dimY, `${spacingValue.toFixed(2)}m`, 0, false);
        }

        ctx.save();
        ctx.fillStyle = '#000'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        if (appState.postModel !== 'y_shape') {
             ctx.translate(beamOffsetScaled, beamCenterY); ctx.rotate(angle);
             ctx.fillText(`Pente = ${roofSlope}°`, 0, panelY - 10);
        }
        ctx.restore();
        ctx.restore();
        
        // Return boundary box for PDF cropping (in meters/drawing units)
        // We define the drawing units relative to the scale (1 unit = 1m in real life)
        const marginMeters = 1.0;
        return {
            minX: -(values.panelWidth / 2) - marginMeters,
            maxX: values.panelWidth / 2 + marginMeters,
            minY: -values.postHeight - marginMeters,
            maxY: marginMeters // Just above the ground line (Y=0)
        };
    }

    function drawFacade(canvas, ctx, viewManager, values) {
        // Logique de dessin de la façade (conservée intégralement)
        const { postHeight, facadeLength, leftOverhang, rightOverhang, groundSlopeFacade, postWidth, panelWidth, roofSlope, invertSlope, lowPointHeight, alignRoof, pvLayout, baseAltimetry, purlinHeight } = values;
        const { width, height } = setupCanvas(canvas);
        if (width === 0 || height === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(viewManager.panX, viewManager.panY); ctx.scale(viewManager.zoom, viewManager.zoom);
        ctx.translate(width / 2, height / 2);
        const distances = appState.parsedDistances;
        if (!distances) { ctx.restore(); return; }
        const roofApparentHeight = Math.abs(panelWidth * Math.sin(roofSlope * Math.PI / 180 * (invertSlope ? -1 : 1)));

        const totalDrawingWidth = facadeLength;
        const totalDrawingHeight = postHeight + Math.abs(groundSlopeFacade) + roofApparentHeight + 5;
        const scale = Math.min(width / (totalDrawingWidth + 4), height / (totalDrawingHeight + 4)) * 0.9;
        
        const originX = -totalDrawingWidth * scale / 2;
        const groundYAtOrigin = (postHeight*scale + roofApparentHeight*scale)/2;
        ctx.translate(originX, groundYAtOrigin);

        const getScaledGroundY = (x) => (facadeLength > 0 ? (x / (facadeLength * scale)) * (-groundSlopeFacade * scale) : 0);
        const groundPath = new Path2D();
        const groundDepth = 4 * scale;
        const startX = -width*2/viewManager.zoom; const endX = width*2/viewManager.zoom;
        groundPath.moveTo(startX, getScaledGroundY(startX)); groundPath.lineTo(endX, getScaledGroundY(endX));
        groundPath.lineTo(endX, getScaledGroundY(endX) + groundDepth); groundPath.lineTo(startX, getScaledGroundY(startX) + groundDepth);
        groundPath.closePath();
        ctx.fillStyle = "#f9f9f9"; ctx.fill(groundPath);
        const patternCanvas = document.createElement('canvas'); const patternCtx = patternCanvas.getContext('2d');
        patternCanvas.width = 10; patternCanvas.height = 10;
        patternCtx.strokeStyle = '#cccccc'; patternCtx.lineWidth = 1;
        patternCtx.beginPath(); patternCtx.moveTo(0, 10); patternCtx.lineTo(10, 0); patternCtx.stroke();
        const pattern = ctx.createPattern(patternCanvas, 'repeat');
        ctx.fillStyle = pattern; ctx.fill(groundPath);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 2; ctx.stroke(groundPath);

        const postPositions = [leftOverhang];
        let currentPos = leftOverhang;
        distances.forEach(d => { currentPos += d; postPositions.push(currentPos); });
        const postWidthScaled = Math.max(postWidth * scale, 2);
        ctx.fillStyle = '#f3f4f6'; ctx.strokeStyle = '#374151'; ctx.lineWidth = 1;

        const useRoofAlignment = alignRoof;
        const postTopY_at_0 = getScaledGroundY(0) - postHeight * scale;
        postPositions.forEach(xPos => {
            const groundY = getScaledGroundY(xPos * scale);
            let postTopY, postH;
            if (useRoofAlignment) {
                postTopY = postTopY_at_0;
                postH = groundY - postTopY;
            } else {
                postTopY = groundY - postHeight * scale;
                postH = postHeight * scale;
            }
            ctx.fillRect(xPos * scale - postWidthScaled / 2, postTopY, postWidthScaled, postH);
            ctx.strokeRect(xPos * scale - postWidthScaled / 2, postTopY, postWidthScaled, postH);
        });

        const roofThicknessScaled = roofApparentHeight * scale;
        const structureBottomY_at_0 = getScaledGroundY(0) - lowPointHeight * scale;
        let roofBottomStartY, roofBottomEndY, roofTopStartY, roofTopEndY;
        roofBottomStartY = structureBottomY_at_0;
        if (useRoofAlignment) {
            roofBottomEndY = roofBottomStartY;
        } else {
            roofBottomEndY = getScaledGroundY(facadeLength * scale) - lowPointHeight * scale;
        }
        roofTopStartY = roofBottomStartY - roofThicknessScaled;
        roofTopEndY = roofBottomEndY - roofThicknessScaled;

        // Dessin "façade/panneaux"
        const roofPath = new Path2D();
        roofPath.moveTo(0, roofBottomStartY); roofPath.lineTo(facadeLength * scale, roofBottomEndY);
        roofPath.lineTo(facadeLength * scale, roofTopEndY); roofPath.lineTo(0, roofTopStartY);
        roofPath.closePath();
        ctx.fillStyle = 'rgba(67, 56, 202, 0.7)'; ctx.fill(roofPath); ctx.stroke(roofPath);
        
        const slopeRad = roofSlope * Math.PI / 180;
        const panneFacadeHeight = purlinHeight - (Math.sin(slopeRad) * purlinHeight);
        const panneFacadeHeightScaled = panneFacadeHeight * scale;

        const pannePath = new Path2D();
        pannePath.moveTo(0, roofBottomStartY); // Haut-gauche
        pannePath.lineTo(facadeLength * scale, roofBottomEndY); // Haut-droit
        pannePath.lineTo(facadeLength * scale, roofBottomEndY + panneFacadeHeightScaled); // Bas-droit
        pannePath.lineTo(0, roofBottomStartY + panneFacadeHeightScaled); // Bas-gauche
        pannePath.closePath();
        
        ctx.fillStyle = '#e5e7eb'; // Gris clair (comme pannes en coupe)
        ctx.fill(pannePath);
        ctx.strokeStyle = '#a0aec0'; // Bordure grise
        ctx.lineWidth = 1;
        ctx.stroke(pannePath);

        try {
            let rows = NaN, cols = NaN;
            const cleanedLayout = pvLayout.toLowerCase().replace(/\s/g, '');
            const parts = cleanedLayout.split('x');
            if (parts.length === 2) {
                const part1 = parts[0]; const part2 = parts[1];
                if (part1.includes('l') && part2.includes('c')) { rows = parseInt(part1); cols = parseInt(part2); } 
                else if (part1.includes('c') && part2.includes('l')) { cols = parseInt(part1); rows = parseInt(part2); } 
                else { [rows, cols] = parts.map(Number); } 
            }
            if (!isNaN(rows) && !isNaN(cols) && rows > 0 && cols > 0) {
                const p1 = { x: 0, y: roofBottomStartY };
                const p2 = { x: facadeLength * scale, y: roofBottomEndY };
                const p4 = { x: 0, y: roofTopStartY };
                const v_width = { x: p2.x - p1.x, y: p2.y - p1.y };
                const v_height = { x: p4.x - p1.x, y: p4.y - p1.y };
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 0.5;
                for (let i = 0; i < rows; i++) { 
                    for (let j = 0; j < cols; j++) {
                        const c1x = p1.x + (j/cols)*v_width.x + (i/rows)*v_height.x; 
                        const c1y = p1.y + (j/cols)*v_width.y + (i/rows)*v_height.y;
                        const c2x = p1.x + ((j+1)/cols)*v_width.x + (i/rows)*v_height.x; 
                        const c2y = p1.y + ((j+1)/cols)*v_width.y + (i/rows)*v_height.y;
                        const c3x = p1.x + ((j+1)/cols)*v_width.x + ((i+1)/rows)*v_height.x; 
                        const c3y = p1.y + ((j+1)/cols)*v_width.y + ((i+1)/rows)*v_height.y;
                        const c4x = p1.x + (j/cols)*v_width.x + ((i+1)/rows)*v_height.x; 
                        const c4y = p1.y + (j/cols)*v_width.y + ((i+1)/rows)*v_height.y;
                        ctx.beginPath(); 
                        ctx.moveTo(c1x, c1y); ctx.lineTo(c2x, c2y); ctx.lineTo(c3x, c3y); ctx.lineTo(c4x, c4y); 
                        ctx.closePath(); ctx.stroke(); 
                    } 
                } 
            } 
        } catch(e) { console.error("Format de calepinage PV invalide.", e); }

        const highestRoofPointY = Math.min(roofTopStartY, roofTopEndY);
        const dimLineY1 = highestRoofPointY - 30; const dimLineY2 = highestRoofPointY - 60;
        drawDimensionLine(ctx, 0, dimLineY1, postPositions[0] * scale, dimLineY1, `${leftOverhang.toFixed(1)}m`, 0, false);
        for (let i = 0; i < distances.length; i++) {
            drawDimensionLine(ctx, postPositions[i] * scale, dimLineY1, postPositions[i + 1] * scale, dimLineY1, `${distances[i].toFixed(2)}m`);
        }
        drawDimensionLine(ctx, postPositions[postPositions.length - 1] * scale, dimLineY1, facadeLength * scale, dimLineY1, `${rightOverhang.toFixed(1)}m`, 0, false);
        drawDimensionLine(ctx, 0, dimLineY2, facadeLength * scale, dimLineY2, `${facadeLength.toFixed(2)}m`, 0, false);

        const highPointHeightValue_Left = lowPointHeight + roofApparentHeight;
        let highPointHeightValue_Right = useRoofAlignment ? highPointHeightValue_Left - groundSlopeFacade : highPointHeightValue_Left;

        const dimOffsetLeft = (-2) * scale;
        const dimOffsetRight = facadeLength * scale + (2) * scale;

        drawVerticalDimensionWithLeader(ctx, 0, roofTopStartY, dimOffsetLeft, `${highPointHeightValue_Left.toFixed(2)}m`, getScaledGroundY(0));
        drawVerticalDimensionWithLeader(ctx, facadeLength * scale, roofTopEndY, dimOffsetRight, `${highPointHeightValue_Right.toFixed(2)}m`, getScaledGroundY(facadeLength * scale));

        const altimetryLeft = baseAltimetry;
        const altimetryRight = baseAltimetry + groundSlopeFacade;
        const groundRefPoints = [{ x: 0, refText: `+0.00m`, altText: `${altimetryLeft.toFixed(2)}m (NGF)`}, { x: facadeLength * scale, refText: `${groundSlopeFacade.toFixed(2)}m`, altText: `${altimetryRight.toFixed(2)}m (NGF)`}];
        groundRefPoints.forEach(point => {
            const y = getScaledGroundY(point.x);
            ctx.save(); ctx.fillStyle = appState.dimensionColor; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom'; ctx.fillText(point.refText, point.x, y - 4);
            ctx.textBaseline = 'top'; ctx.font = '12px Arial'; ctx.fillText(point.altText, point.x, y + 4);
            ctx.strokeStyle = appState.dimensionColor; ctx.lineWidth = 1.5; const crossSize = 4;
            ctx.beginPath(); ctx.moveTo(point.x - crossSize, y); ctx.lineTo(point.x + crossSize, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(point.x, y - crossSize); ctx.lineTo(point.x, y + crossSize); ctx.stroke();
            ctx.restore();
        });
        ctx.restore();
        
        // Return boundary box for PDF cropping (in meters/drawing units)
        const marginMeters = 1.0;
        const postMinX = -leftOverhang - postWidth/2;
        const postMaxX = facadeLength + rightOverhang + postWidth/2;
        const maxHeight = values.postHeight + roofApparentHeight + 1.0;
        const minHeight = -postHeight - Math.abs(groundSlopeFacade) - 1.0; 
        
        return {
            minX: postMinX - marginMeters,
            maxX: postMaxX + marginMeters,
            minY: -maxHeight - marginMeters, // Max Y (haut du dessin)
            maxY: 1.0 + Math.abs(groundSlopeFacade) + marginMeters // Min Y (bas du dessin)
        };
    }

    function drawImplantation(canvas, ctx, viewManager, values) {
        // MOD 6.5: Récupération de totalProjectionWidth
        const { facadeLength, panelWidth, roofSlope, leftOverhang, rightOverhang, postWidth, postEccentricity, totalProjectionWidth } = values;
        const distances = appState.parsedDistances;
        if (!distances) return;

        const { width, height } = setupCanvas(canvas);
        if (width === 0 || height === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(viewManager.panX, viewManager.panY); ctx.scale(viewManager.zoom, viewManager.zoom);
        ctx.translate(width / 2, height / 2);

        // MOD 6.5: Utilisation de totalProjectionWidth
        const projectionWidth = totalProjectionWidth;
        const absRoofSlopeRad = Math.abs(roofSlope * Math.PI / 180);
        
        const scale = Math.min(width / (facadeLength+2), height / (projectionWidth+2)) * 0.9;
        
        ctx.translate(-facadeLength * scale / 2, -projectionWidth * scale / 2);

        // MOD 6.5: Dessin de l'implantation pour Y
        if (appState.postModel === 'y_shape') {
            const projWidthOneSide = (values.panelWidth * Math.cos(absRoofSlopeRad)) * scale;
            const postWidthScaled = values.postWidth * scale;
            
            ctx.strokeStyle = '#374151'; ctx.lineWidth = 3;
            // Dessiner la section de gauche (haut)
            ctx.strokeRect(0, 0, facadeLength * scale, projWidthOneSide);
            // Dessiner la section de droite (bas)
            ctx.strokeRect(0, projWidthOneSide + postWidthScaled, facadeLength * scale, projWidthOneSide);

        } else {
            // Dessin standard pour les autres modèles
            ctx.strokeStyle = '#374151';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, facadeLength * scale, projectionWidth * scale);
        }
        
        const midY = projectionWidth * scale / 2;
        const postPositions = [leftOverhang];
        let currentPos = leftOverhang;
        distances.forEach(d => { currentPos += d; postPositions.push(currentPos); });

        ctx.save(); ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
        const axisExtension = 80;

        if (appState.postModel === 'double' || appState.postModel === 'inclinedPost') {
            const spacing = (appState.postModel === 'double' ? values.postSpacing : values.postSpacingInclined) * scale / 2;
            ctx.beginPath(); ctx.moveTo(-axisExtension, midY - spacing); ctx.lineTo(facadeLength * scale + axisExtension, midY - spacing); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-axisExtension, midY + spacing); ctx.lineTo(facadeLength * scale + axisExtension, midY + spacing); ctx.stroke();
        } else if (appState.postModel === 'offset') {
            const eccentricityScaled = values.postEccentricity * scale; // Utilise valeur clampée
            ctx.beginPath(); ctx.moveTo(-axisExtension, midY + eccentricityScaled); ctx.lineTo(facadeLength * scale + axisExtension, midY + eccentricityScaled); ctx.stroke();
        } else { // Single et Y
            ctx.beginPath(); ctx.moveTo(-axisExtension, midY); ctx.lineTo(facadeLength * scale + axisExtension, midY); ctx.stroke();
        }

        postPositions.forEach(xPos => { ctx.beginPath(); ctx.moveTo(xPos * scale, -axisExtension); ctx.lineTo(xPos * scale, projectionWidth * scale + axisExtension); ctx.stroke(); });
        ctx.restore();

        const postSize = postWidth * scale; ctx.fillStyle = '#6b7280';
        postPositions.forEach(xPos => {
            if (appState.postModel === 'double' || appState.postModel === 'inclinedPost') {
                const spacing = (appState.postModel === 'double' ? values.postSpacing : values.postSpacingInclined) * scale / 2;
                ctx.fillRect(xPos * scale - postSize / 2, midY - spacing - postSize / 2, postSize, postSize);
                ctx.fillRect(xPos * scale - postSize / 2, midY + spacing - postSize / 2, postSize, postSize);
            } else if (appState.postModel === 'offset') {
                const eccentricityScaled = values.postEccentricity * scale; // Utilise valeur clampée
                ctx.fillRect(xPos * scale - postSize / 2, midY + eccentricityScaled - postSize / 2, postSize, postSize);
            } else { // Single et Y
                 ctx.fillRect(xPos * scale - postSize/2, midY - postSize/2, postSize, postSize);
            }
        });
        if (appState.postModel === 'double' || appState.postModel === 'inclinedPost' || (appState.postModel === 'offset' && postEccentricity !== 0)) {
            const firstPostX = postPositions[0] * scale;
            const dimOffset = -30 - postSize;
            if (appState.postModel === 'double' || appState.postModel === 'inclinedPost') {
                const spacingValue = (appState.postModel === 'double' ? values.postSpacing : values.postSpacingInclined);
                const spacing = spacingValue * scale;
                drawDimensionLine(ctx, firstPostX, midY - spacing / 2, firstPostX, midY + spacing / 2, `${spacingValue.toFixed(2)}m`, dimOffset, true);
            }
            if (appState.postModel === 'offset' && postEccentricity !== 0) {
                const eccentricityScaled = values.postEccentricity * scale; // Utilise valeur clampée
                drawDimensionLine(ctx, firstPostX, midY, firstPostX, midY + eccentricityScaled, `${values.postEccentricity.toFixed(2)}m`, dimOffset, true);
            }
        }
        drawDimensionLine(ctx, 0, 0, facadeLength * scale, 0, `${facadeLength.toFixed(2)}m`, -30, false);
        const interPostDimY = projectionWidth * scale + 30;
        drawDimensionLine(ctx, 0, interPostDimY, leftOverhang * scale, interPostDimY, `${leftOverhang.toFixed(2)}m`, 0, false);
        drawDimensionLine(ctx, (facadeLength - rightOverhang) * scale, interPostDimY, facadeLength * scale, interPostDimY, `${rightOverhang.toFixed(2)}m`, 0, false);
        for (let i = 0; i < postPositions.length - 1; i++) { drawDimensionLine(ctx, postPositions[i] * scale, interPostDimY, postPositions[i+1] * scale, interPostDimY, `${distances[i].toFixed(2)}m`); }
        
        // MOD 6.5: Cotation de la projection horizontale totale (11.75m ou similaire)
        drawDimensionLine(ctx, facadeLength * scale, 0, facadeLength * scale, projectionWidth * scale, `${projectionWidth.toFixed(2)}m`, 30, true); 
        ctx.restore();
        
        // Return boundary box for PDF cropping (in meters/drawing units)
        const marginMeters = 1.0;
        return {
            minX: -marginMeters,
            maxX: facadeLength + marginMeters,
            minY: -marginMeters,
            maxY: projectionWidth + marginMeters
        };
    }

    // --- LOGIC & EVENT HANDLERS ---
    function getFormValues() {
        const values = {};
        document.querySelectorAll('.all-inputs').forEach(el => {
            if (!el.id) return;
            let val = (el.type === 'checkbox') ? el.checked : el.value;
            if (el.type === 'number' && !el.readOnly) val = parseFloat(val) || 0;

    function validateAndSetEccentricity(overhangH, overhangL, values) {
        const errorEl = document.getElementById('postEccentricityError');
        
        const maxEccentricity = (values.panelWidth / 2) * Math.cos(values.roofSlope * Math.PI / 180);
        
        errorEl.textContent = `(Limite auto: ±${maxEccentricity.toFixed(2)}m)`;
        
        const beamLength = (appState.postModel === 'y_shape') 
            ? values.panelWidth - values.overhangSymValue
            : values.panelWidth - (overhangH + overhangL);
            
        return { maxEccentricity, beamLength };
    }


    function updateAppLogic() {
        let values = getFormValues(); 
        
        let overhangH, overhangL;
        const symValue = values.overhangSymValue;
        const asymHigh = values.overhangAsymHigh;
        const asymLow = values.overhangAsymLow;
        
        if (appState.overhangType === 'sym' || appState.postModel === 'y_shape') { 
            // Pour Y, le porte-à-faux est du côté "haut structure"
            overhangH = overhangL = symValue;
        } else {
            // Pour Asymétrique, H est le côté Haut (opposite to low point)
            const sideLow = appState.invertSlope ? asymHigh : asymLow; // côté où la toiture est basse
            const sideHigh = appState.invertSlope ? asymLow : asymHigh; // côté où la toiture est haute
            
            // Le côté bas de la toiture est toujours le côté L. Le côté haut de la toiture est toujours le côté H.
            // On conserve ici la définition initiale des inputs pour les calculs.
            overhangH = asymHigh; 
            overhangL = asymLow;
        }
        
        const { beamLength, maxEccentricity } = validateAndSetEccentricity(overhangH, overhangL, values);
        values.beamLength = beamLength;

        if (appState.postModel === 'offset') {
            const currentEccentricity = values.postEccentricity; 
            if (Math.abs(currentEccentricity) > maxEccentricity) {
                values.postEccentricity = Math.sign(currentEccentricity) * maxEccentricity;
            }
        }

        const { passageHeight, beamHeight, purlinHeight, integrationSystemHeight, panelThickness } = values;
        const newLowPointHeight = passageHeight + beamHeight + purlinHeight + integrationSystemHeight + panelThickness;
        document.getElementById('lowPointHeight').value = newLowPointHeight.toFixed(2);
        values.lowPointHeight = newLowPointHeight;
        
        const roofSlopeRadians = values.roofSlope * Math.PI / 180 * (appState.invertSlope ? -1 : 1);
        
        let newPostHeight;
        if (appState.postModel === 'y_shape') {
            const cosA_Y = Math.cos(Math.abs(roofSlopeRadians));
            const beamLengthForY = values.beamLength; 
            const y_lowest_beam_absolute = -passageHeight;
            const y_lowest_beam_point_relative_to_center = (beamLengthForY / 2) * Math.abs(Math.sin(roofSlopeRadians)) + (beamHeight / 2) * Math.cos(roofSlopeRadians);
            
            const beamCenterY_m_orig = y_lowest_beam_absolute - y_lowest_beam_point_relative_to_center;
            
            const beamCenterY_m = beamCenterY_m_orig - 0.03; 
            
            const topOfBeamY_m = beamCenterY_m - (beamHeight / 2) * Math.cos(roofSlopeRadians);
            newPostHeight = -topOfBeamY_m;
            
        } else {
            const y_lowest_beam_absolute = -passageHeight;
            const y_lowest_beam_point_relative_to_center = (values.beamLength / 2) * Math.abs(Math.sin(roofSlopeRadians)) + (beamHeight / 2) * Math.cos(roofSlopeRadians);
            const beamCenterY_m = y_lowest_beam_absolute - y_lowest_beam_point_relative_to_center;
            
            if (appState.traversePosition === 'top') {
                newPostHeight = -(beamCenterY_m + beamHeight / 2);
            } else {
                newPostHeight = -beamCenterY_m;
            }
        }

        document.getElementById('postHeight').value = newPostHeight.toFixed(2);
        values.postHeight = newPostHeight;
        
        const absRoofSlopeRad = Math.abs(values.roofSlope * Math.PI / 180);
        if (appState.postModel === 'y_shape') {
            values.totalProjectionWidth = (values.panelWidth * Math.cos(absRoofSlopeRad) * 2) + values.postWidth;
        } else {
            values.totalProjectionWidth = values.panelWidth * Math.cos(absRoofSlopeRad);
        }
        
        values.heightUnderBrace = parseFloat(document.getElementById('heightUnderBrace').value);
        appState.parsedDistances = parsePostDistances();
        
        return values;
    }

    function parsePostDistances() {
        const input = document.getElementById('postDistances'); const errorDiv = document.getElementById('postDistancesError'); const expression = input.value.trim();
        errorDiv.innerHTML = ""; if (expression === "") return [];
        const getFallback = () => { try { return parseExpression(lastValidPostDistances); } catch { return null; } };
        const parseExpression = (expr) => {
            const distances = []; const segments = expr.replace(/,/g, '+').split('+');
            for (const segment of segments) {
                const cleanedSegment = segment.trim(); if (cleanedSegment === '') continue;
                if (cleanedSegment.includes('*')) {
                    const parts = cleanedSegment.split('*'); if (parts.length !== 2 || parts.some(p => p.trim() === '')) throw new Error(`Format invalide: "${segment}"`);
                    const count = parseInt(parts[0].trim(), 10); const value = parseFloat(parts[1].trim());
                    if (isNaN(count) || isNaN(value) || count < 0) throw new Error(`Valeurs invalides: "${segment}"`);
                    for (let i = 0; i < count; i++) distances.push(value);
                } else {
                    const value = parseFloat(cleanedSegment); if (isNaN(value)) throw new Error(`Valeur non numérique: "${segment}"`);
                    distances.push(value);
                }
            }
            return distances;
        };
        let distances;
        try { distances = parseExpression(expression); } catch (e) { errorDiv.textContent = e.message; return getFallback(); }
        const values = getFormValues(); const totalDistance = distances.reduce((a, b) => a + b, 0);
        const calculatedLength = values.leftOverhang + totalDistance + values.rightOverhang;
        if (Math.abs(calculatedLength - values.facadeLength) > 0.01) { errorDiv.innerHTML = `Attention : Somme entraxes (${totalDistance.toFixed(2)}m) + p-à-f (${(values.leftOverhang + values.rightOverhang).toFixed(2)}m) = ${calculatedLength.toFixed(2)}m ≠ longueur totale (${values.facadeLength.toFixed(2)}m).`; }
        lastValidPostDistances = expression; return distances;
    }

                isUpdateScheduled = false; resolve();
            });
        });

    const addCanvasToPdf = async (canvasId, title, doc, options = {}) => {
        const canvasEl = document.getElementById(canvasId); 
        if (!canvasEl) {
            console.error(`Canvas element with id ${canvasId} not found.`);
            return;
        };
        
        // 1. Gérer la visibilité
        let parentView = canvasEl.closest('.tab-content-1, .tab-content-2');
        if(!parentView) {
            if (canvasId === 'mapContainer') {
                parentView = document.getElementById('viewCalepinage');
            } else {
                console.error(`Could not find parent view for ${canvasId}`);
                return;
            }
        }
        const wasHidden = parentView.classList.contains('hidden');
        let correspondingTab;
        
        if (wasHidden) {
            const tabId = parentView.id.replace('view', 'tab');
            correspondingTab = document.getElementById(tabId);
            if(correspondingTab) {
                const groupClass = correspondingTab.classList.contains('tab-group-1') ? '.tab-group-1' : '.tab-group-2';
                const contentClass = correspondingTab.classList.contains('tab-group-1') ? '.tab-content-1' : '.tab-content-2';
                // Switch temporaire pour la capture
                document.querySelectorAll(groupClass).forEach(t => t.classList.remove('active'));
                document.querySelectorAll(contentClass).forEach(c => c.classList.add('hidden'));
                parentView.classList.remove('hidden');
            }
        }
        await new Promise(resolve => setTimeout(resolve, (canvasId === 'mapContainer' ? 500 : 100))); 
        
        // 2. Récupérer les données de la bounding box (en mètres)
        let bounds = { minX: 0, maxX: 1, minY: 0, maxY: 1 };
        if (canvasId !== 'mapContainer') {
             // Appelle la fonction de dessin pour obtenir la bounding box
             const currentManager = managers[canvasId.replace('Canvas', '')];
             if(currentManager && currentManager.drawFunction) {
                 const calculatedValues = updateAppLogic();
                 bounds = currentManager.drawFunction(canvasEl, canvasEl.getContext('2d'), currentManager, calculatedValues);
             }
        }

        // 3. Capturer le canvas complet (résolution élevée)
        const scaleFactor = 3; 
        const canvas = await html2canvas(canvasEl, { scale: scaleFactor, backgroundColor: '#ffffff', useCORS: true, logging: false });
        if (canvas.width === 0 || canvas.height === 0) { throw new Error(`Capture failed for ${canvasId}`); }

        // 4. Calculer la zone de rognage (en pixels)
        const { x, y, w, h } = options; // Espace disponible dans le PDF (mm)
        const pdfUnitToPixel = (px) => (px / canvasEl.clientWidth) * canvas.width; // Conversion des unités de dessin à la résolution de html2canvas
        
        let cropX = 0, cropY = 0, cropWidth = canvas.width, cropHeight = canvas.height;
        let finalRatio = canvas.width / canvas.height;

        if (canvasId !== 'mapContainer') {
            const viewportWidthMeters = bounds.maxX - bounds.minX;
            const viewportHeightMeters = bounds.maxY - bounds.minY;
            
            const pixelsPerMeterX = canvas.width / viewportWidthMeters;
            const pixelsPerMeterY = canvas.height / viewportHeightMeters;
            const pixelsPerMeter = (pixelsPerMeterX + pixelsPerMeterY) / 2; // Utiliser une moyenne (ou la plus petite pour ne pas rogner)
            
            // Calcul de la zone de rognage en pixels
            const currentMinX = -((canvas.width / 2) + currentManager.panX) / currentManager.zoom / scaleFactor / pixelsPerMeter;
            const currentMinY = ((canvas.height * 0.8) + currentManager.panY) / currentManager.zoom / scaleFactor / pixelsPerMeter;

            cropX = (bounds.minX * pixelsPerMeter) * scaleFactor + (canvas.width / 2) * scaleFactor; 
            cropY = (bounds.minY * pixelsPerMeter) * scaleFactor + (canvas.height * 0.8) * scaleFactor;
            cropWidth = viewportWidthMeters * pixelsPerMeter * scaleFactor;
            cropHeight = viewportHeightMeters * pixelsPerMeter * scaleFactor;
            
            finalRatio = viewportWidthMeters / viewportHeightMeters;

             // Ajustement pour être sûr que les coordonnées ne sont pas négatives
            cropX = Math.max(0, cropX);
            cropY = Math.max(0, cropY);
            cropWidth = Math.min(canvas.width, cropX + cropWidth) - cropX;
            cropHeight = Math.min(canvas.height, cropY + cropHeight) - cropY;
        }

        // 5. Créer un canvas de rognage temporaire
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = cropWidth;
        tempCanvas.height = cropHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
        
        const imgData = tempCanvas.toDataURL('image/png');
        
        // 6. Mise à l'échelle pour le PDF (respect du ratio)
        const pdfContentW = w;
        const pdfContentH = h;
        
        let imgWidthMM = pdfContentW;
        let imgHeightMM = imgWidthMM / finalRatio;
        
        if (imgHeightMM > pdfContentH) {
            imgHeightMM = pdfContentH;
            imgWidthMM = imgHeightMM * finalRatio;
        }

        // 7. Positionnement dans l'espace disponible (centrage + marge interne)
        const posX = x + (pdfContentW - imgWidthMM) / 2; 
        const posY = y + (pdfContentH - imgHeightMM) / 2;

        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.text(title, x, y + 2); // Titre: 2mm de marge intérieure, en haut à gauche
        
        doc.addImage(imgData, 'PNG', posX, posY, imgWidthMM, imgHeightMM, undefined, 'FAST');

        // 8. Revenir à l'état initial
        if (wasHidden && correspondingTab) {
            const groupClass = correspondingTab.classList.contains('tab-group-1') ? '.tab-group-1' : '.tab-group-2';
            const contentClass = correspondingTab.classList.contains('tab-group-1') ? '.tab-content-1' : '.tab-content-2';
            
            document.querySelectorAll(groupClass).forEach(t => t.classList.remove('active'));
            document.querySelectorAll(contentClass).forEach(c => c.classList.add('hidden'));
            
            // On ne rétablit pas l'actif ici, on le fait à la fin du process PDF
        }
    };

        // Fonction pour mettre à jour le localStorage et synchroniser avec la page calepinage
        function syncToCalepinage(fieldName, value, updateGridInfo = false, gridInfoField = null) {
            try {
                const savedData = localStorage.getItem('solarProjectData');
                if (!savedData) return;

                const data = JSON.parse(savedData);
                if (!data || !data.formData) return;

                if (_currentPvId) {
                    // Mettre à jour uniquement le PV courant
                    if (data.formData[_currentPvId]) {
                        data.formData[_currentPvId][fieldName] = value;
                    }
                    if (updateGridInfo && gridInfoField && data.shapes && data.shapes[_currentPvId] && data.shapes[_currentPvId].gridInfo) {
                        data.shapes[_currentPvId].gridInfo[gridInfoField] = parseFloat(value);
                    }
                } else {
                    // Fallback: mettre à jour tous les PV
                    Object.keys(data.formData).forEach(pvId => {
                        if (data.formData[pvId]) {
                            data.formData[pvId][fieldName] = value;
                        }
                        if (updateGridInfo && gridInfoField && data.shapes && data.shapes[pvId] && data.shapes[pvId].gridInfo) {
                            data.shapes[pvId].gridInfo[gridInfoField] = parseFloat(value);
                        }
                    });
                }

                // Sauvegarder dans localStorage
                localStorage.setItem('solarProjectData', JSON.stringify(data));

                // Envoyer un message au parent pour mettre à jour l'interface
                if (window.parent !== window) {
                    window.parent.postMessage({
                        action: 'updateCalepinageField',
                        fieldName: fieldName,
                        value: value,
                        pvId: _currentPvId
                    }, '*');
                }

                console.log(`Synchronisation ${fieldName} vers calepinage (${_currentPvId || 'tous'}):`, value);
            } catch (error) {
                console.error('Erreur lors de la synchronisation:', error);
            }
        }

                const value = parseFloat(e.target.value);
                if (!isNaN(value) && value > 0) {
                    // Mettre à jour à la fois dimensionsChampPVlargeur et gridInfo.totalPanelLength
                    syncToCalepinage('dimensionsChampPVlargeur', value.toFixed(2), true, 'totalPanelLength');
                }
            });
        }

        // Synchronisation de la pente de toiture (roofSlope → inclinaison)
        const roofSlopeInput = document.getElementById('roofSlope');
        if (roofSlopeInput) {

                 * Crée une copie haute résolution d'un canvas
                 * @param {HTMLCanvasElement} sourceCanvas - Canvas source
                 * @param {number} scale - Facteur d'échelle (2 = double résolution)
                 * @returns {string} - Image base64 haute résolution
                 */
                const captureHighResCanvas = (sourceCanvas, scale = 2) => {

                    }

                    // Définir les dimensions à haute résolution
                    tempCanvas.width = sourceCanvas.width * scale;
                    tempCanvas.height = sourceCanvas.height * scale;

                    // Activer l'anti-aliasing pour une meilleure qualité
                    tempCtx.imageSmoothingEnabled = true;
                    tempCtx.imageSmoothingQuality = 'high';

                    // Remplir avec un fond blanc
                    tempCtx.fillStyle = '#ffffff';
                    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                    // Dessiner le canvas source à l'échelle
                    tempCtx.scale(scale, scale);
                    tempCtx.drawImage(sourceCanvas, 0, 0);

                    // Convertir en base64 avec qualité maximale
                    return tempCanvas.toDataURL('image/png', 1.0);
                };

                        viewImplantation.classList.add('hidden');
                        console.log('viewImplantation remis en hidden');
                    }
                    if (coupeWasHidden && viewCoupe) {
                        viewCoupe.classList.add('hidden');
                        console.log('viewCoupe remis en hidden');
                    }
                }, 150); // Attendre 150ms pour que les dessins soient complètement rendus

            } catch (error) {
                console.error('Erreur lors de la sauvegarde des canvas:', error);
            }
        }

        // Sauvegarder les canvas à chaque mise à jour
        // On utilise un debounce pour ne pas sauvegarder trop souvent
        let saveCanvasTimeout;
        const debouncedSaveCanvas = () => {
            clearTimeout(saveCanvasTimeout);
            saveCanvasTimeout = setTimeout(() => {
                saveCanvasToLocalStorage();
            }, 1000); // Attendre 1 seconde après la dernière modification
        };

        // Écouter les changements sur tous les inputs pour sauvegarder les canvas
        document.querySelectorAll('.all-inputs').forEach(input => {
            input.addEventListener('input', debouncedSaveCanvas);
        });

        // Sauvegarder immédiatement au chargement
        setTimeout(() => {
            saveCanvasToLocalStorage();
        }, 2000);

        // Écouter les messages de la page parente pour forcer la sauvegarde des canvas
        // Utilisé notamment lors de la génération du PDF
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'forceSaveCanvas') {
                console.log('Message reçu de la page parente : forceSaveCanvas');
                saveCanvasToLocalStorage();
            }
        });

        // ========= FIN SAUVEGARDE CANVAS =========

        // ========= FIN SYNCHRONISATION =========
    });

    const resizeObserver = new ResizeObserver(() => {
        adjustCanvasHeights();
        scheduleUpdate();
    });
    const appModalEl = document.getElementById('app-modal');
    
    if (appModalEl) {
        resizeObserver.observe(appModalEl);
    }
    
    const controlsContainer = document.getElementById('controls-container');
    if (controlsContainer) {
        controlsContainer.addEventListener('scroll', () => {
            adjustCanvasHeights();
        });
    }
   
});
</script>
