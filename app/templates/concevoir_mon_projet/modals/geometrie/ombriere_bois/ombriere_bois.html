    <style>
        /* Suppression globale des bandes grises et maximisation de l'affichage pour TOUS les onglets */
        #modal-body {
            padding: 0 !important;
            background-color: #ffffff !important;
        }

        #modal-body .container {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #modal-body .grid {
            gap: 0 !important;
        }

        #canvas-column {
            gap: 0 !important;
            padding: 0 !important;
            background-color: #f3f4f6 !important;
        }

        #controls-container {
            background-color: #f9fafb !important;
            border-left: 1px solid #e5e7eb !important;
            border-radius: 0 !important;
        }

        .canvas-container {
            background-color: #ffffff !important;
            border: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            flex: 1 1 auto !important;
        }

        canvas {
            height: 100% !important;
            max-height: none !important;
        }

        #coupe-container {
            display:flex;
            flex-direction: column;
            flex: 1 1 50% !important;
            width: 100% !important;
            margin-top: 0 !important;
            transition: height 0.1s ease-out;
            margin-left: 1%!important;

        }

        #viewCoupe{
            display: flex;
            flex-direction: column;
            min-height: 0;
            /* height: 80vh; */
            max-height: 90vh;
            width: 98%;
            margin-left: 1%;
        }

        #facade-block-container {
            display: flex;
            flex-direction: column;
            flex: 1 1 50% !important;            
            margin-left: 1%!important;
            width:98% !important;
            min-height: 0;
            height: 40vh;
        }

        .border-b.mb-2 {
            margin-bottom: 0 !important;
            background-color: #f3f4f6;
        }

        /* Masquage et agrandissement pleine page */
        #app-modal.form-hidden #controls-container {
            width: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            opacity: 0;
            border: none;
            display: none !important;
        }

        #app-modal.form-hidden #canvas-column {
            grid-column: span 3 / span 3 !important;
        }


        #app-modal.calepinage-full #facade-block-container {
            display: none !important;
            height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        #app-modal.calepinage-full #coupe-container {
            height: 100% !important;
            flex: 1 1 100% !important;
            width: 100% !important;
            margin: 0 !important;
            max-height: none !important;
            min-height: 85vh !important;
            border-radius : 10px;
        }
    </style>
    <!-- Plans de coupe / façade fixes pendant le défilement du formulaire (cf. ce fichier). -->

    <div id="modal-overlay"></div>

        <div id="modal-header">
            <h2>Ombridesign 2.1</h2>

                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5l-7.5-7.5 7.5-7.5" />
                    </svg>
                </button>
                <button id="reset-modal-btn" class="modal-header-btn" title="Réinitialiser la position et la taille">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m4.5 11.25h-4.5m4.5 0v-4.5m0 .001L15 15" />

                    </svg>

                                    <div id="inclinedPostCanvasControls"

                                        <input type="checkbox" id="hideCentralPostCanvas"
                                            class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500">

                                            class="text-sm text-gray-700 select-none cursor-pointer">Masquer le poteau

                                    </div>

                        </div>

                        <div id="facade-block-container" class="flex flex-col min-h-0">

                            <div id="viewFacade" class="tab-content-2 canvas-container flex-1">

                                    <button id="zoomInFacade" class="tool-button icon-only"
                                        title="Zoom avant">+</button>
                                    <button id="zoomOutFacade" class="tool-button icon-only"
                                        title="Zoom arrière">-</button>
                                    <button id="panFacade" class="tool-button icon-only"
                                        title="Déplacer (Panoramique)">🖐</button>
                                    <button id="resetFacade" class="tool-button icon-only" title="Tout voir">⛶</button>
                                </div>
                                <h3 class="view-title">Plan de façade</h3>
                                <canvas id="facadeCanvas"></canvas>
                            </div>

                            <div id="viewImplantation" class="tab-content-2 hidden canvas-container flex-1">
                                <div class="absolute top-2 left-2 z-10 flex gap-0.5 bg-white p-1 rounded-lg shadow-md">
                                    <button id="zoomInImplantation" class="tool-button icon-only"
                                        title="Zoom avant">+</button>
                                    <button id="zoomOutImplantation" class="tool-button icon-only"
                                        title="Zoom arrière">-</button>
                                    <button id="panImplantation" class="tool-button icon-only"

                                    <button id="resetImplantation" class="tool-button icon-only"

                            </div>

                    </div>

                    <div id="controls-container" class="lg:col-span-1 controls-container p-4 rounded-lg shadow-md">

                        <h2 class="input-group-title">Données des coupes</h2>
                        <!-- Données fabricant charpente bois -->
                        <div class="span-2 mb-4">
                            <label class="block text-sm font-medium text-gray-700">Fabricants</label>
                            <div id="fabricant-group"
                                class="mt-1 flex flex-wrap gap-1 rounded-md shadow-sm toggle-btn-group equal-width">
                                <button id="fabPiveteau"
                                    class="flex-1 relative inline-flex items-center justify-center px-2 py-2 border border-gray-300 text-sm font-medium rounded-l-md active">Piveteau</button>
                                <button id="fabAzelan"
                                    class="flex-1 relative -ml-px inline-flex items-center justify-center px-2 py-2 border border-gray-300 text-sm font-medium">Azélan</button>
                                <button id="fabModuland"
                                    class="flex-1 relative -ml-px inline-flex items-center justify-center px-2 py-2 border border-gray-300 text-sm font-medium rounded-r-md">Moduland</button>

                        </div>

                                    <button id="modelDoublePost"
                                        class="flex-1 relative -ml-px inline-flex items-center justify-center px-2 py-2 border border-gray-300 text-sm font-medium rounded-r-md">Simple

                                <div class="flex flex-wrap rounded-md shadow-sm w-full toggle-btn-group">

                                <div class="flex flex-wrap rounded-md shadow-sm w-full toggle-btn-group">

                        <div class="span-2 flex items-center">

                                <button id="reinforceJarrets"
                                    class="relative -ml-px inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-r-md">Jarrets</button>
                            </div>
                        </div>
                        <div id="doublePostControls" class="hidden span-2 input-grid p-3 bg-gray-50 rounded-md border">

                                    (m)</label>
                                <input type="number" id="postSpacing" value="2.0" step="0.01" min="0.01" max="20"

                                    class="all-inputs mt-1 block w-full rounded-md border-gray-300 shadow-sm sm:text-sm bg-gray-100"
                                    readonly>
                            </div>
                            <div class="hidden"><label for="postInclinationInclined"

                            </div>
                            <div class="span-2 flex items-center">
                                <input type="checkbox" id="hideCentralPost"
                                    class="all-inputs h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500">

                                    central</label>
                            </div>
                        </div>
                        <div id="offsetPostControls" class="hidden span-2 input-grid p-3 bg-gray-50 rounded-md border">
                            <div class="span-2" id="offsetPositionContainer"><label

                                <div id="offset-position-group"

                            </div>

                                </div>
                                <div>
                                    <label for="postEccentricity"

                                </div>
                            </div>
                        </div>

                        <div id="simpleTravoltaControls"
                            class="hidden span-2 input-grid p-3 bg-gray-50 rounded-md border">
                            <div><label for="postSpacingTravolta"

    <script>
        // Validation supplémentaire: hauteur sous renfort < hauteur libre de passage
        const passageHeightInput = document.getElementById('passageHeight');
        const heightUnderBraceInput = document.getElementById('heightUnderBrace');

        function validateHeightUnderBrace() {
            const passage = parseFloat(passageHeightInput.value) || 0;
            const brace = parseFloat(heightUnderBraceInput.value) || 0;
            if (brace >= passage) {
                heightUnderBraceInput.setCustomValidity('La hauteur sous renfort doit être inférieure à la hauteur libre de passage.');
            } else {
                heightUnderBraceInput.setCustomValidity('');
            }
        }
        passageHeightInput.addEventListener('input', validateHeightUnderBrace);
        heightUnderBraceInput.addEventListener('input', validateHeightUnderBrace);
        validateHeightUnderBrace();
    </script>

    <!-- Script pour la sauvegarde des plans pour l'export PDF -->

    <script type="module">
        import GeometryPlansSaver from "{{ url_for('static', filename='concevoir_mon_projet/javascript/services/GeometryPlansSaver.js') }}";

        // Attendre que le DOM soit chargé
        document.addEventListener('DOMContentLoaded', () => {
            const saver = new GeometryPlansSaver();

            // Attacher l'événement au bouton de sauvegarde
            const savePlansBtn = document.getElementById('savePlansBtn');
            if (savePlansBtn) {
                savePlansBtn.addEventListener('click', async () => {
                    savePlansBtn.disabled = true;
                    savePlansBtn.textContent = '💾 Sauvegarde en cours...';
                    await saver.savePlans();
                    savePlansBtn.disabled = false;
                    savePlansBtn.innerHTML = '💾 Sauvegarder les plans pour export PDF';
                });
            }
        });



    </script>

    <!-- script pour la synchronisation des dimensions -->
    <script>
        // Résoudre le pvId ciblé depuis l'URL (?pvId=PV1) ou le premier PV disponible
        function _getTargetPvId(data) {
            const urlParams = new URLSearchParams(window.location.search);
            const pvId = urlParams.get('pvId');
            if (pvId && data.shapes?.[pvId]) return pvId;
            return Object.keys(data.shapes ?? {})[0] ?? null;
        }

        // CORRECTIF (demande explicite : cohérence Toiture Y / Bipente) : le modèle "Modèle Est-Ouest"
        // (id modelYShape, ex-"Toiture Y") suppose désormais une toiture Bipente symétrique côté
        // calepinage (2 champs PV1.1/PV1.2, chacun déjà à la largeur d'un bras — cf. getSubFieldsData,
        // CalculationUtils.js). Contrairement à l'ombrière métal, le bois n'a qu'un seul modèle
        // bipente-dépendant (pas de "Double toiture Y" côté bois) : pas besoin d'un filtre à deux
        // catégories comme applyRoofGeometryFilter côté métal, un simple masquage suffit. Appelé à la
        // fin de applyModelFilters() pour ne jamais se faire écraser par son "allBtns.forEach(...)".
        /**
         * CORRECTIF (demande explicite : le modèle Y ne s'affiche « toujours et uniquement » que pour
         * « Diviser en 2 pans symétriques ») : la géométrie vient du champ PV réel du moteur de
         * calepinage (page parente) ; l'ancien stockage PRO, plus alimenté depuis l'unification (il
         * répondait donc toujours « non »), ne sert plus que de repli.
         */
        function estBipenteSymetrique() {
            try {
                const pvIdUrl = new URLSearchParams(window.location.search).get('pvId');
                const service = window.parent && window.parent !== window
                    && window.parent.CalepinageMaisonConfigurateurOmbriere;
                if (service && typeof service.geometrieToitureDuChamp === 'function') {
                    const geometrie = service.geometrieToitureDuChamp(pvIdUrl || undefined);
                    if (geometrie) return geometrie === 'Bipente_symetrique';
                }
            } catch (e) { /* repli ci-dessous */ }
            try {
                const saved = JSON.parse(localStorage.getItem('solarProjectData') || '{}');
                const pvId = _getTargetPvId(saved);
                const type = (pvId && saved.formData && saved.formData[pvId]) ? saved.formData[pvId].toiture_pente_type : null;
                return type === 'Bipente_symetrique';
            } catch (e) {
                return false;
            }
        }

        function applyRoofGeometryFilterBois() {
            const btnYShape = document.getElementById('modelYShape');
            if (!btnYShape) return;
            const isBipenteSymetrique = estBipenteSymetrique();
            if (isBipenteSymetrique) {
                // Même règle que l'ombrière métal : en 2 pans symétriques, seul le modèle bipente
                // (Est-Ouest) est proposé — toujours visible, même si l'ancien filtre count_y
                // (stockage périmé) l'avait masqué ; les modèles monopente sont masqués.
                const btnGroup = document.getElementById('model-btn-group');
                const errorDiv = document.getElementById('model-filter-error');
                if (btnGroup) btnGroup.style.display = 'flex';
                if (errorDiv) errorDiv.classList.add('hidden');
                document.querySelectorAll('#model-btn-group button').forEach((b) => {
                    b.style.display = (b === btnYShape) ? 'inline-flex' : 'none';
                });
                if (!btnYShape.classList.contains('active')) btnYShape.click();
                return;
            }
            if (!isBipenteSymetrique) {
                btnYShape.style.display = 'none';
                if (btnYShape.classList.contains('active')) {
                    btnYShape.classList.remove('active');
                    const firstOther = Array.from(document.querySelectorAll('#model-btn-group button'))
                        .find(b => b !== btnYShape && b.style.display !== 'none');
                    if (firstOther) firstOther.click();
                }
            }
        }

        // Appliquer les règles d'affichage des boutons selon count_y
        function applyModelFilters() {
            const bypassCheckbox = document.getElementById('bypass-filters');
            const errorDiv = document.getElementById('model-filter-error');
            const btnGroup = document.getElementById('model-btn-group');

            const btnInclined = document.getElementById('modelInclinedPost'); // Gd. Monopan (12m)
            //const btnOffset = document.getElementById('modelOffsetPost'); // Simple 2 poteaux (7m)
            const btnDouble = document.getElementById('modelDoublePost'); // Simple 2 poteaux (5m)
            const btnSimpleAzelan = document.getElementById('modelSimpleAzelan');
            const btnSimpleTravolta = document.getElementById('modelSimpleTravolta');
            const btnSimpleTravolta2 = document.getElementById('modelSimpleTravolta2');
            const btnYShape = document.getElementById('modelYShape'); // Modèle Est-Ouest

            const allBtns = [btnInclined, btnDouble, btnSimpleAzelan, btnSimpleTravolta, btnSimpleTravolta2, btnYShape];

            allBtns.forEach(btn => { if (btn) btn.style.display = 'inline-flex'; });
            if (errorDiv) errorDiv.classList.add('hidden');
            if (btnGroup) btnGroup.style.display = 'flex';

            if (bypassCheckbox && bypassCheckbox.checked) { applyRoofGeometryFilterBois(); return; }

            let count_y = null;

            // Essayer de lire count_y depuis l'iframe
            try {
                const iframe = document.getElementById('iframeCalepinage');
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    const countYInput = iframe.contentWindow.document.getElementById('count_y');
                    if (countYInput && countYInput.value) {
                        count_y = parseInt(countYInput.value, 10);
                    }
                }
            } catch (e) { }

            // Fallback via le localStorage
            if (count_y === null || isNaN(count_y)) {
                try {
                    const savedData = localStorage.getItem('solarProjectData');
                    if (savedData) {
                        const data = JSON.parse(savedData);
                        const targetPvId = _getTargetPvId(data);
                        if (targetPvId && data.formData && data.formData[targetPvId]) {
                            if (data.formData[targetPvId].count_y) {
                                count_y = parseInt(data.formData[targetPvId].count_y, 10);
                            } else if (data.shapes && data.shapes[targetPvId] && data.shapes[targetPvId].gridInfo) {
                                count_y = parseInt(data.shapes[targetPvId].gridInfo.numRows, 10);
                            }
                        }
                    }
                } catch (e) { console.warn('Erreur lecture count_y:', e); }
            }

            if (count_y === null || isNaN(count_y)) { applyRoofGeometryFilterBois(); return; }

            allBtns.forEach(btn => { if (btn) btn.style.display = 'none'; });
            let hasVisible = false;

            if (count_y === 3) {
                if (btnDouble) { btnDouble.style.display = 'inline-flex'; hasVisible = true; }
                if (btnSimpleAzelan) { btnSimpleAzelan.style.display = 'inline-flex'; hasVisible = true; }
                if (btnSimpleTravolta) { btnSimpleTravolta.style.display = 'inline-flex'; hasVisible = true; }
                if (btnSimpleTravolta2) { btnSimpleTravolta2.style.display = 'inline-flex'; hasVisible = true; }
            } else if (count_y === 4) {
                if (btnSimpleTravolta) { btnSimpleTravolta.style.display = 'inline-flex'; hasVisible = true; }
                if (btnSimpleTravolta2) { btnSimpleTravolta2.style.display = 'inline-flex'; hasVisible = true; }
            }

            if (count_y === 6 || count_y === 7) {
                if (btnInclined) { btnInclined.style.display = 'inline-flex'; hasVisible = true; }
            }

            if ([6, 8, 10, 12, 14].includes(count_y)) {
                if (btnYShape) { btnYShape.style.display = 'inline-flex'; hasVisible = true; }
            }

            if (!hasVisible) {
                if (btnGroup) btnGroup.style.display = 'none';
                if (errorDiv) {
                    errorDiv.textContent = "Configuration calepinage non conforme aux gabarits des ombrières existants. Veuillez contacter le fabricant de l’ombrière pour la prise en compte de votre calepinage hors standard dans ses modèles de structure.";
                    errorDiv.classList.remove('hidden');
                }
            } else {
                if (btnGroup) btnGroup.style.display = 'flex';
                if (errorDiv) errorDiv.classList.add('hidden');

                const activeBtn = document.querySelector('#model-btn-group button.active');
                if (!activeBtn || activeBtn.style.display === 'none') {
                    const firstVisible = allBtns.find(btn => btn && btn.style.display !== 'none');
                    if (firstVisible) firstVisible.click();
                }
            }

            applyRoofGeometryFilterBois();
        }


        // fin logique filtrage ombrière bois

        function updateDimensionsFromStorage() {
            try {
                const savedData = localStorage.getItem('solarProjectData');
                if (!savedData) return;

                const data = JSON.parse(savedData);
                const targetPvId = _getTargetPvId(data);
                if (!targetPvId) return;

                const gridInfo = data.shapes[targetPvId]?.gridInfo;
                if (!gridInfo) return;

                const totalLength = gridInfo.totalPanelLength;
                const totalWidth = gridInfo.totalPanelWidth;
                // Normalisation identique à SummaryModal.js
                const longueur = Math.max(totalLength, totalWidth);
                let largeur = Math.min(totalLength, totalWidth);
                // CORRECTIF (bug rapporté : "c'est la valeur monopente qui est affichée à chaque pan
                // de toiture" — modèle Est-Ouest / "Toiture Y" en Bipente symétrique) : gridInfo ici
                // représente la toiture COMBINÉE (les deux pans), pas un seul bras — même règle que
                // SummaryModal.js (source du tableau de synthèse PV1.1/PV1.2), qui divise déjà cette
                // même largeur par 2 pour l'affichage par sous-champ. Sans ce correctif, panelWidth
                // recevait la largeur totale au lieu de la largeur d'un bras, que "Toiture Y" ne
                // redivise plus depuis le correctif précédent.
                const toiturePenteType = data.formData?.[targetPvId]?.toiture_pente_type;
                if (toiturePenteType === 'Bipente_symetrique') {
                    largeur = largeur / 2;
                }

                // Synchronise "Nbre de PV Calepinage (LxC)" avec la disposition réelle du calepinage
                // (même source que le tableau de synthèse de SummaryModal.js : gridInfo.numRows/numCols).
                const pvLayoutInput = document.getElementById('pvLayout');
                if (pvLayoutInput && gridInfo.numRows && gridInfo.numCols) {
                    pvLayoutInput.value = `${gridInfo.numRows}L x ${gridInfo.numCols}C`;
                }

                const facadeInput = document.getElementById('facadeLength');
                const panelWidthInput = document.getElementById('panelWidth');

                // facadeLength = longueur (grande dim), comme SummaryModal
                if (facadeInput && longueur) {
                    facadeInput.value = longueur.toFixed(2);
                    facadeInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
                // panelWidth = largeur (petite dim), comme SummaryModal
                if (panelWidthInput && largeur) {
                    panelWidthInput.value = largeur.toFixed(2);
                    panelWidthInput.dispatchEvent(new Event('input', { bubbles: true }));
                }

                // Synchroniser l'inclinaison depuis formData du pvId ciblé
                const inclinaison = data.formData?.[targetPvId]?.inclinaison;
                if (inclinaison !== undefined && inclinaison !== '' && inclinaison !== null) {
                    const roofSlopeInput = document.getElementById('roofSlope');
                    if (roofSlopeInput) {
                        roofSlopeInput.value = inclinaison;
                        roofSlopeInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                    // Envoyer l'inclinaison et les dimensions au calepinage iframe
                    const iframe = document.getElementById('iframeCalepinage');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ type: 'SET_INCLINAISON', value: Number(inclinaison) }, '*');
                    }

                    // Envoyer les dimensions toiture au calepinage iframe
                    // Priorité : formData.longueur/largeur (dimensions surface dessinée), sinon gridInfo
                    const formLongueur = parseFloat(data.formData?.[targetPvId]?.longueur) || null;
                    const formLargeur = parseFloat(data.formData?.[targetPvId]?.largeur) || null;
                    const dimLongueur = formLongueur || (totalLength ? Number(totalLength.toFixed(2)) : null);
                    const dimLargeur = formLargeur || (totalWidth ? Number(totalWidth.toFixed(2)) : null);
                    if (dimLongueur && dimLargeur) {
                        const iframe = document.getElementById('iframeCalepinage');
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.postMessage({
                                type: 'SET_TOITURE_DIMS',
                                longueur: dimLongueur,
                                largeur: dimLargeur
                            }, '*');

                        } else {
                            // Fallback de sécurité si calepinage.html est inclus directement
                            const longInput = document.getElementById('longueur');
                            if (longInput && dimLongueur) {
                                longInput.value = dimLongueur;
                                longInput.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                            const largInput = document.getElementById('largeur');
                            if (largInput && dimLargeur) {
                                largInput.value = dimLargeur;
                                largInput.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                        }
                    }
                }

                // Optionnel : actualiser le filtrage après synchro
                applyModelFilters();
            } catch (e) {
                console.warn('Erreur lors de la lecture des dimensions:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateDimensionsFromStorage();

            const bypassCheckbox = document.getElementById('bypass-filters');
            if (bypassCheckbox) {
                bypassCheckbox.addEventListener('change', applyModelFilters);
            }

            setTimeout(() => {
                applyModelFilters();
            }, 500);

            // Envoyer l'inclinaison au calepinage une fois l'iframe chargé
            const iframe = document.getElementById('iframeCalepinage');
            if (iframe) {
                iframe.addEventListener('load', () => {
                    updateDimensionsFromStorage();
                    try {
                        const countYInput = iframe.contentWindow.document.getElementById('count_y');
                        if (countYInput) {
                            countYInput.addEventListener('change', applyModelFilters);
                            countYInput.addEventListener('input', applyModelFilters);
                        }
                    } catch (e) { }
                    applyModelFilters();
                });
            }

            // --- SUPPRESSION DYNAMIQUE DE L'ESPACE VIDE EN BAS POUR LE CALEPINAGE ---
            const appModal = document.getElementById('app-modal');
            const tabCalepinage = document.getElementById('tabCalepinage');

            function checkCalepinageState() {
                if (tabCalepinage && tabCalepinage.classList.contains('active')) {
                    appModal.classList.add('calepinage-full', 'form-hidden');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.dispatchEvent(new Event('resize'));
                        if (typeof iframe.contentWindow.calculateAndDraw === 'function') {
                            iframe.contentWindow.calculateAndDraw();
                        }
                    }
                } else {
                    appModal.classList.remove('calepinage-full', 'form-hidden');
                }
            }

            // Vérifier à chaque clic sur un onglet du groupe du haut
            document.querySelectorAll('.tab-group-1').forEach(btn => {
                btn.addEventListener('click', () => setTimeout(checkCalepinageState, 15));
            });

            setTimeout(checkCalepinageState, 100); // Vérification initiale
        });
        window.addEventListener('storage', (e) => {
            if (e.key === 'solarProjectData') {
                updateDimensionsFromStorage();
                applyModelFilters();
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CALEPINAGE_UPDATE') {
                applyModelFilters();
            }
        });
    </script>
