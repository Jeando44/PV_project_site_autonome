<title>Concevoir mon projet</title>
<script>
    // Page d'accueil (carte de calepinage) du parcours ouvert depuis Solakvan : '/concevoir_mon_projet/'
    // (PRO) ou '/concevoir_mon_projet/residentiel/' (cf. app/utils/parcours.py). Les scripts qui
    // testaient « suis-je sur la carte ? » ou y revenaient en dur passent par ces deux helpers.
    window.SKV_URL_ACCUEIL = {{ (parcours_projet.url_accueil if parcours_projet else '/concevoir_mon_projet/')|tojson }};
    window.estPageAccueil = function (chemin) {
        var p = chemin === undefined ? window.location.pathname : chemin;
        return p === '/concevoir_mon_projet/' || p === window.SKV_URL_ACCUEIL;
    };
    // Fonctions masquées par le parcours (cf. app/utils/parcours.py, liste `masquer`).
    window.SKV_PARCOURS_MASQUER = {{ (parcours_projet.masquer if parcours_projet else [])|tojson }};
    window.parcoursMasque = function (cle) { return window.SKV_PARCOURS_MASQUER.indexOf(cle) !== -1; };
</script>
<style>.skv-masque-parcours { display: none !important; }</style>
